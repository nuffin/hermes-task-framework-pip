[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-task-framework"
version = "1.0.4"
description = "Structured task management skills for Hermes Agent — task creation, decomposition, stage gates"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/nuffin/hermes-task-framework-pip"

[tool.setuptools.packages.find]
include = ["hermes_task_framework*"]

[tool.setuptools.package-data]
"hermes_task_framework" = ["skills/**/*"]
